<VirtualHost *:80>

  # Ensure logs maintain the real IP of the request rather than the proxy's
  RemoteIPHeader X-Forwarded-For
  LogFormat "%a %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" modremoteip 
  CustomLog logs/access_log modremoteip

  DocumentRoot /var/www/html/

  <Directory /var/www/html>
    Options FollowSymLinks
    AllowOverride All
  </Directory>

</VirtualHost>
